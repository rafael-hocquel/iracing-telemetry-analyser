[project]
name = "iracing-telemetry-analyser"
version = "0.1.0"
description = "Sim racing telemetry analysis: braking points, brake traces and lap-by-lap KPIs against a reference lap."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "freeport>=0.1.15",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
